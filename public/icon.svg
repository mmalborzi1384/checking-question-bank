<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <!-- Graph edges (Wheel/Star dominating graph motif) -->
  <g stroke="#93c5fd" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="112" x2="394" y2="212" />
    <line x1="394" y1="212" x2="342" y2="376" />
    <line x1="342" y1="376" x2="170" y2="376" />
    <line x1="170" y1="376" x2="118" y2="212" />
    <line x1="118" y1="212" x2="256" y2="112" />
    <line x1="256" y1="256" x2="256" y2="112" />
    <line x1="256" y1="256" x2="394" y2="212" />
    <line x1="256" y1="256" x2="342" y2="376" />
    <line x1="256" y1="256" x2="170" y2="376" />
    <line x1="256" y1="256" x2="118" y2="212" />
  </g>
  <!-- Outer vertices -->
  <g fill="#f8fafc" stroke="#1d4ed8" stroke-width="10">
    <circle cx="256" cy="112" r="28" />
    <circle cx="394" cy="212" r="28" />
    <circle cx="342" cy="376" r="28" />
    <circle cx="170" cy="376" r="28" />
    <circle cx="118" cy="212" r="28" />
  </g>
  <!-- Center dominating vertex -->
  <circle cx="256" cy="256" r="54" fill="none" stroke="#38bdf8" stroke-width="8" opacity="0.55" />
  <circle cx="256" cy="256" r="38" fill="#38bdf8" stroke="#ffffff" stroke-width="10" />
</svg>
