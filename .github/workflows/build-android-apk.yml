name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (required by Capacitor 8 & Vite 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (JDK for Capacitor 8 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build offline web bundle
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Initialize & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/graph-theory-review-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: graph-theory-review-android-apk
          path: apk-output/graph-theory-review-debug.apk
          retention-days: 30
